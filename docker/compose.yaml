services:
  oracle:
    image: container-registry.oracle.com/database/free:latest
    container_name: atlaspay-oracle
    restart: unless-stopped
    ports:
      - "127.0.0.1:1521:1521"
    environment:
      ORACLE_PWD: "${ORACLE_PWD:?Set ORACLE_PWD in .env}"
    volumes:
      - atlaspay-oracle-data:/opt/oracle/oradata
    shm_size: 1g
    mem_limit: 4g
    cpus: 2

volumes:
  atlaspay-oracle-data:
